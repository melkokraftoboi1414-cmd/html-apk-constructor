name: Android APK
on:
  workflow_dispatch:
    inputs:
      html_base64:
        description: "Constructor sahifasidan nusxalangan Base64 HTML (40 KB gacha)"
        required: true
        type: string
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor Android toolchain
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Prepare uploaded HTML
        env:
          HTML_BASE64: ${{ inputs.html_base64 }}
        run: |
          mkdir -p www
          printf '%s' "$HTML_BASE64" | base64 --decode > www/index.html
          test -s www/index.html
          grep -Eqi '<html|<!doctype' www/index.html
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-constructor-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
